<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер автозапчастей</title>
    <!-- Библиотека для сканирования штрихкодов через камеру -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Кнопка СКАН сверху */
        .scan-btn {
            width: 100%;
            max-width: 500px;
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 16px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.2s;
        }
        .scan-btn:active {
            background-color: #5a6268;
        }

        /* Область камеры */
        #reader-container {
            width: 100%;
            max-width: 500px;
            display: none;
            margin-bottom: 20px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            position: relative;
        }
        video {
            width: 100% !important;
            height: auto !important;
            border-radius: 12px;
        }
        .close-camera {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            z-index: 10;
        }

        /* Индикатор загрузки */
        #loader {
            display: none;
            text-align: center;
            font-size: 16px;
            color: #adb5bd;
            margin: 20px 0;
        }

        /* Контейнер результатов (зеленые блоки) */
        #results-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-card {
            display: flex;
            align-items: center;
            background-color: #2b4d27; /* Зеленый оттенок */
            border: 2px solid #3d6b38;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s, background-color 0.2s;
        }
        .result-card:active {
            transform: scale(0.98);
            background-color: #355e31;
        }

        /* Кликабельная зона с текстом запчасти */
        .result-info {
            flex-grow: 1;
            padding: 16px;
            cursor: pointer;
            color: #ffffff;
        }
        .result-info .part-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .result-info .part-details {
            font-size: 13px;
            color: #d4edda;
        }

        /* Блок управления количеством справа */
        .quantity-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.2);
            padding: 8px 12px;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 50px;
        }
        .qty-btn {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            padding: 2px 8px;
        }
        .qty-value {
            font-size: 16px;
            font-weight: bold;
            color: white;
            margin: 2px 0;
        }

        /* Статус отправки */
        #status-msg {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #28a745;
        }
    </style>
</head>
<body>

    <!-- Кнопка СКАН -->
    <button class="scan-btn" onclick="startScanner()">СКАН</button>

    <!-- Опеределитель камеры -->
    <div id="reader-container">
        <button class="close-camera" onclick="stopScanner()">Закрыть</button>
        <video id="video"></video>
    </div>

    <div id="loader">Ищем варианты в интернете...</div>
    <div id="status-msg"></div>

    <!-- Список найденных вариантов -->
    <div id="results-container"></div>

    <script>
        // ЗАМЕНИТЕ НА URL ВАШЕГО РАЗВЕРНУТОГО GOOGLE APPS SCRIPT ВЕБХУКА
        const WEBHOOK_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec";

        let codeReader = null;
        let isScanning = false;

        // Запуск сканирования
        function startScanner() {
            document.getElementById('results-container').innerHTML = '';
            document.getElementById('status-msg').innerText = '';
            document.getElementById('reader-container').style.display = 'block';

            if (!codeReader) {
                codeReader = new ZXing.BrowserMultiFormatReader();
            }

            isScanning = true;
            codeReader.decodeFromVideoDevice(null, 'video', (result, err) => {
                if (result && isScanning) {
                    isScanning = false;
                    const scannedText = result.getText();
                    stopScanner();
                    fetchPartInfo(scannedText);
                }
            }).catch(err => {
                console.error(err);
                alert("Ошибка доступа к камере: " + err);
            });
        }

        // Остановка сканера
        function stopScanner() {
            isScanning = false;
            if (codeReader) {
                codeReader.reset();
            }
            document.getElementById('reader-container').style.display = 'none';
        }

        // Запрос к бэкенду/модели за вариантами запчастей
        async function fetchPartInfo(barcode) {
            const loader = document.getElementById('loader');
            const statusMsg = document.getElementById('status-msg');
            loader.style.display = 'block';
            statusMsg.innerText = `Штрихкод ${barcode} распознан. Ищем данные...`;

            try {
                // Вы можете отправлять штрихкод на ваш Apps Script или собственный сервер, 
                // который возвращает массив вариантов (например, до 3 штук).
                // Для примера отправляем POST на ваш же вебхук с флагом поиска вариантов, 
                // либо используем ваш скрипт.
                
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "search", barcode: barcode })
                });
                
                const data = await response.json();
                loader.style.display = 'none';
                
                // Ожидаем, что сервер вернет массив items: [{articul, brand, name, applicability}, ...]
                if (data && data.items && data.items.length > 0) {
                    renderResults(barcode, data.items);
                    statusMsg.innerText = "Выберите нужный вариант из списка:";
                } else {
                    // Если сервер вернул один объект или ничего не нашлось, делаем дефолтный вариант
                    renderResults(barcode, [{
                        articul: barcode,
                        brand: "Неизвестно",
                        name: "Товар по штрихкоду",
                        applicability: "Не указана"
                    }]);
                }
            } catch (error) {
                loader.style.display = 'none';
                // Фоллбек на случай если бэкенд отдал один товар или произошла ошибка сети
                renderResults(barcode, [{
                    articul: barcode,
                    brand: "Неизвестно",
                    name: "Товар по штрихкоду",
                    applicability: "Ошибка связи с ИИ"
                }]);
            }
        }

        // Отрисовка зеленых карточек с кнопками плюс/минус
        function renderResults(barcode, items) {
            const container = document.getElementById('results-container');
            container.innerHTML = '';

            items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'result-card';

                card.innerHTML = `
                    <div class="result-info" onclick="sendToSheet('${barcode}', \`${item.articul}\`, \`${item.brand}\`, \`${item.name}\`, \`${item.applicability}\`, ${index})">
                        <div class="part-name">${item.brand} — ${item.name}</div>
                        <div class="part-details">Артикул: ${item.articul} | Применимость: ${item.applicability}</div>
                    </div>
                    <div class="quantity-control">
                        <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
                        <span class="qty-value" id="qty-${index}">1</span>
                        <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Изменение количества плюсом / минусом
        function changeQty(index, delta) {
            const qtySpan = document.getElementById(`qty-${index}`);
            let currentQty = parseInt(qtySpan.innerText);
            currentQty += delta;
            if (currentQty < 1) currentQty = 1;
            qtySpan.innerText = currentQty;
        }

        // Отправка выбранного варианта в Google Таблицу и автоматический перезапуск камеры
        async function sendToSheet(barcode, articul, brand, name, applicability, index) {
            const qty = document.getElementById(`qty-${index}`).innerText;
            const statusMsg = document.getElementById('status-msg');
            statusMsg.innerText = "Отправка в таблицу...";

            const payload = {
                action: "save",
                barcode: barcode,
                articul: articul,
                brand: brand,
                name: name,
                applicability: applicability,
                quantity: qty
            };

            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                statusMsg.innerText = "Успешно отправлено!";
                document.getElementById('results-container').innerHTML = '';

                // Автоматически сразу открываем камеру для нового сканирования
                setTimeout(() => {
                    startScanner();
                }, 500);

            } catch (e) {
                statusMsg.innerText = "Ошибка отправки: " + e.toString();
            }
        }
    </script>
</body>
</html>
