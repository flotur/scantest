<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер автозапчастей</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .scan-btn {
            width: 100%;
            max-width: 500px;
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 16px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .scan-btn:active {
            background-color: #5a6268;
        }
        #reader-container {
            width: 100%;
            max-width: 500px;
            display: none;
            margin-bottom: 20px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            position: relative;
        }
        video {
            width: 100% !important;
            height: auto !important;
            display: block;
            border-radius: 12px;
        }
        .close-camera {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            z-index: 10;
        }
        #loader {
            display: none;
            text-align: center;
            font-size: 16px;
            color: #adb5bd;
            margin: 20px 0;
        }
        #results-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .result-card {
            display: flex;
            align-items: center;
            background-color: #2b4d27;
            border: 2px solid #3d6b38;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .result-info {
            flex-grow: 1;
            padding: 16px;
            cursor: pointer;
            color: #ffffff;
        }
        .result-info .part-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .result-info .part-details {
            font-size: 13px;
            color: #d4edda;
        }
        .quantity-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.2);
            padding: 8px 12px;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 50px;
        }
        .qty-btn {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            padding: 2px 8px;
        }
        .qty-value {
            font-size: 16px;
            font-weight: bold;
            color: white;
            margin: 2px 0;
        }
        #status-msg {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #28a745;
        }
    </style>
</head>
<body>

    <button class="scan-btn" onclick="startScanner()">СКАН</button>

    <div id="reader-container">
        <button class="close-camera" onclick="stopScanner()">Закрыть</button>
        <video id="video" autoplay playsinline muted></video>
    </div>

    <div id="loader">Ищем варианты в интернете...</div>
    <div id="status-msg"></div>
    <div id="results-container"></div>

    <script>
        // ССЫЛКА НА GOOGLE APPS SCRIPT
        const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbw3BECvU9LTs-IpMIVrp-n45jKytBcDP8YIb2Br8tQ3q7UEYrDXN3sfGbnbo0H_MJoK/exec";

        let videoStream = null;
        let scanningInterval = null;
        let barcodeDetector = null;

        async function startScanner() {
            document.getElementById('results-container').innerHTML = '';
            document.getElementById('status-msg').innerText = '';
            document.getElementById('reader-container').style.display = 'block';

            if (!('BarcodeDetector' in window)) {
                alert("Ваш браузер не поддерживает встроенный BarcodeDetector. Обновите Chrome на телефоне.");
                return;
            }

            if (!barcodeDetector) {
                barcodeDetector = new BarcodeDetector({
                    formats: ['code_128', 'code_39', 'ean_13', 'ean_8', 'upc_a', 'upc_e', 'qr_code']
                });
            }

            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: "environment",
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                });
                
                const videoElement = document.getElementById('video');
                videoElement.srcObject = videoStream;
                await videoElement.play();

                scanningInterval = setInterval(async () => {
                    try {
                        const barcodes = await barcodeDetector.detect(videoElement);
                        if (barcodes.length > 0) {
                            const scannedText = barcodes[0].rawValue;
                            stopScanner();
                            fetchPartInfo(scannedText);
                        }
                    } catch (e) {
                        // Игнорируем ошибки отдельного кадра
                    }
                }, 150);

            } catch (err) {
                console.error(err);
                alert("Не удалось запустить камеру: " + err);
            }
        }

        function stopScanner() {
            if (scanningInterval) {
                clearInterval(scanningInterval);
                scanningInterval = null;
            }
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            document.getElementById('reader-container').style.display = 'none';
        }

        async function fetchPartInfo(barcode) {
            const loader = document.getElementById('loader');
            const statusMsg = document.getElementById('status-msg');
            loader.style.display = 'block';
            statusMsg.innerText = `Штрихкод ${barcode} распознан! Ищем данные...`;

            try {
                // Заголовки удалены, чтобы браузер не отправлял CORS preflight (OPTIONS) запрос
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "search", barcode: barcode })
                });
                
                const data = await response.json();
                loader.style.display = 'none';
                
                if (data && data.items && data.items.length > 0) {
                    renderResults(barcode, data.items);
                    statusMsg.innerText = "Выберите нужный вариант из списка:";
                } else {
                    renderResults(barcode, [{
                        articul: barcode,
                        brand: "Неизвестно",
                        name: "Товар по штрихкоду",
                        applicability: "Не указана"
                    }]);
                }
            } catch (error) {
                console.error("Fetch error:", error);
                loader.style.display = 'none';
                renderResults(barcode, [{
                    articul: barcode,
                    brand: "Неизвестно",
                    name: "Товар по штрихкоду",
                    applicability: "Ошибка связи: " + error.message
                }]);
            }
        }

        function renderResults(barcode, items) {
            const container = document.getElementById('results-container');
            container.innerHTML = '';

            items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'result-card';

                // Экранирование строк от кавычек
                const safeArticul = String(item.articul || '').replace(/'/g, "\\'");
                const safeBrand = String(item.brand || '').replace(/'/g, "\\'");
                const safeName = String(item.name || '').replace(/'/g, "\\'");
                const safeApplicability = String(item.applicability || '').replace(/'/g, "\\'");

                card.innerHTML = `
                    <div class="result-info" onclick="sendToSheet('${barcode}', '${safeArticul}', '${safeBrand}', '${safeName}', '${safeApplicability}', ${index})">
                        <div class="part-name">${item.brand} — ${item.name}</div>
                        <div class="part-details">Артикул: ${item.articul} | Применимость: ${item.applicability}</div>
                    </div>
                    <div class="quantity-control">
                        <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
                        <span class="qty-value" id="qty-${index}">1</span>
                        <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function changeQty(index, delta) {
            const qtySpan = document.getElementById(`qty-${index}`);
            let currentQty = parseInt(qtySpan.innerText);
            currentQty += delta;
            if (currentQty < 1) currentQty = 1;
            qtySpan.innerText = currentQty;
        }

        async function sendToSheet(barcode, articul, brand, name, applicability, index) {
            const qty = document.getElementById(`qty-${index}`).innerText;
            const statusMsg = document.getElementById('status-msg');
            statusMsg.innerText = "Отправка в таблицу...";

            const payload = {
                action: "save",
                barcode: barcode,
                articul: articul,
                brand: brand,
                name: name,
                applicability: applicability,
                quantity: qty
            };

            try {
                // Заголовки удалены, чтобы браузер не отправлял CORS preflight (OPTIONS) запрос
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                statusMsg.innerText = "Успешно отправлено!";
                document.getElementById('results-container').innerHTML = '';

                setTimeout(() => {
                    startScanner();
                }, 800);

            } catch (e) {
                statusMsg.innerText = "Ошибка отправки: " + e.toString();
            }
        }
    </script>
</body>
</html>
